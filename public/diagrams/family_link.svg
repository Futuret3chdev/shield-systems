<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <rect width="720" height="380" fill="#0d1117"/>
  
  <text x="360" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">Family Link — Visible & Revocable</text>
  <text x="360" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Designed for safety · Banner always shown · Child can unlink</text>

  <!-- Guardian -->
  <rect x="60" y="100" width="200" height="140" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">Guardian</text>
  <text x="160" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Creates link code</text>
  <text x="160" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Sees last-seen</text>
  <text x="160" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Location only if shared</text>
  <text x="160" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">POST /v1/family/link</text>

  <!-- Arrow -->
  <path d="M270 170 L330 170" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Child device -->
  <rect x="340" y="100" width="200" height="140" rx="12" fill="#161b22" stroke="#00c9a7" stroke-width="2"/>
  <text x="440" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#00c9a7">Child Device</text>
  <text x="440" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Accepts link</text>
  <text x="440" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Banner always visible</text>
  <text x="440" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Can unlink anytime</text>
  <text x="440" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">POST /v1/family/accept</text>

  <!-- Arrow 2 -->
  <path d="M550 170 L610 170" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="520" y="100" width="160" height="140" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#d2a8ff">Visible Link</text>
  <text x="600" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c9d1d9">No covert mode</text>
  <text x="600" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c9d1d9">Consent first</text>
  <text x="600" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c9d1d9">Revocable by child</text>

  <!-- Bottom principles -->
  <rect x="60" y="270" width="600" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="360" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Location Share is off by default · Presence (last seen) is available · Full Privacy Policy applies</text>
  <text x="360" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">https://memetorrent.futuret3ch.com.au/shield · support@futuret3ch.com.au</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="360" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681">© Futuret3ch Security · MemeTorrent ecosystem · No watermarks</text>
</svg>
